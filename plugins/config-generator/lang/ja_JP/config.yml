extra-list-intro: |
  ExtraList（CustomSkinLoader 14.4 以上が必要）は、カスタムスキンサーバーを手軽に追加するための機能です。<br>
  下の ExtraList ファイルをダウンロードして <code>.minecraft/CustomSkinLoader/ExtraList</code> ディレクトリに入れ、Minecraft を再起動すれば完了です！
